wave_id: W01
title: FEAT-GRACE-PACKET-YAML-SIDECAR-MIGRATION-PLAN-W01-SOURCE-HASH-IMPACT
objective: Add a read-only migration impact planner that scans strict `EXECUTION_PACKET.md`
  packets, reports which canonical `EXECUTION_PACKET.yaml` sidecars would be created
  or updated, and shows source hash impact and runtime registry status without writing
  files.
status: ready
phase: PHASE-GRACE-ORCHESTRATOR-PORTABLE-MVP
depends_on:
- FEAT-GRACE-PACKET-YAML-SIDECAR-AUDIT-W01-CORPUS-DRY-RUN-REPORT
modules:
- M-GRACE-PACKET-PARSER
- M-GRACE-PACKET-AUTHORING
- M-GRACE-CLI
- M-GRACE-PACKET-VALIDATION
- M-GRACE-RUNTIME-REGISTRY
allowed_write_scope:
- prefect_grace/platform/packet_parser.py
- prefect_grace/platform/packet_yaml_sidecar_migration_plan.py
- prefect_grace/platform/packet_yaml_sidecar_audit.py
- prefect_grace/platform/packet_yaml_sidecar_sync.py
- prefect_grace/cli_commands/evidence.py
- prefect_grace/cli_commands/parser.py
- tests/test_prefect_grace_packet_yaml_sidecar_migration_plan.py
- tests/test_prefect_grace_cli_contracts.py
- prefect_grace/packets/FEAT-GRACE-PACKET-YAML-SIDECAR-MIGRATION-PLAN/**
frozen_scope:
- backend/**
- frontend/**
- .worktrees/**
- prefect_grace/executor_history.yaml
- prefect_grace/packet_registry.yaml
- /var/lib/grace-orchestrator/**
- prefect_grace/packets/FEAT-ASTRO-*/**
- prefect_grace/packets/FEAT-WEEK-*/**
must_preserve:
- Planner is read-only and must not create, update, or delete sidecars.
- 'Planner output always reports `writes: []`, `source_mutations: []`, `prefect_runs_created:
  0`, and `live_agents_started: 0`.'
- Discovery only includes files named exactly `EXECUTION_PACKET.md` below the packet
  root.
- Canonical packets are counted but are not included in plan items by default.
- Invalid sidecars and skipped packets are bounded findings and do not fail the command
  when the root scan completes.
- Missing or unreadable packet roots fail closed with `ok=false`.
- Missing or unloadable project config does not fail the plan; registry status is null
  and a warning is emitted.
- Runtime registry state, executor history, Prefect runs, live agents, backend, frontend,
  Docker, and Playwright remain untouched.
verification: '- `python3 -m pytest -q tests/test_prefect_grace_packet_yaml_sidecar_migration_plan.py
  tests/test_prefect_grace_cli_contracts.py -q`

  - `python3 -m compileall -q prefect_grace/platform/packet_parser.py prefect_grace/platform/packet_yaml_sidecar_migration_plan.py
  prefect_grace/cli_commands/evidence.py prefect_grace/cli_commands/parser.py`

  - `python3 scripts/grace_lint.py prefect_grace/platform/packet_parser.py`

  - `python3 scripts/grace_lint.py prefect_grace/platform/packet_yaml_sidecar_migration_plan.py`

  - `python3 scripts/grace_lint.py prefect_grace/cli_commands/evidence.py`

  - `python3 scripts/grace_lint.py prefect_grace/cli_commands/parser.py`

  - `python3 -m prefect_grace.cli plan-packet-yaml-sidecar-migration --packet-root
  prefect_grace/packets --project prefect_grace/project.yaml --json --limit 10`

  - `python3 -m prefect_grace.cli validate-packet prefect_grace/packets/FEAT-GRACE-PACKET-YAML-SIDECAR-MIGRATION-PLAN/EXECUTION_PACKET.md
  --strict --json`

  - `python3 -m prefect_grace.cli validate-evidence-manifest prefect_grace/packets/FEAT-GRACE-PACKET-YAML-SIDECAR-MIGRATION-PLAN/EVIDENCE/attempt-0001/evidence_manifest.json
  --packet prefect_grace/packets/FEAT-GRACE-PACKET-YAML-SIDECAR-MIGRATION-PLAN/EXECUTION_PACKET.md
  --json`

  - `git diff --check`'
expected_evidence:
- EVIDENCE/attempt-0001/evidence_manifest.json
- EVIDENCE/attempt-0001/SUMMARY.md
- EVIDENCE/attempt-0001/targeted_pytest.txt
- EVIDENCE/attempt-0001/compile_output.txt
- EVIDENCE/attempt-0001/lint_output.txt
- EVIDENCE/attempt-0001/cli_plan_dry_run.json
- EVIDENCE/attempt-0001/strict_validate_packet.json
- EVIDENCE/attempt-0001/scope_check.json
escalation_triggers:
- Planner creates or edits an `EXECUTION_PACKET.yaml` sidecar.
- Planner scans arbitrary markdown fragments instead of exact `EXECUTION_PACKET.md`
  files.
- Invalid sidecars or missing project config are treated as scan failure.
- Root-level scan failures are reported as success.
- The command starts Prefect runs, live agents, Docker, backend, frontend, or Playwright.
