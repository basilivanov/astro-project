wave_id: W01
title: GRACE Orchestrator Evidence Gate Auto-Recovery
objective: 'Implement auto-recovery and automated rework logic (failure packet generation
  and retry assignments when evidence checks fail) in the GRACE orchestrator.


  If the step Verifier (tests or log collection) or Reviewer (insufficient write scope)
  returns an error, the orchestrator should automatically generate a failure packet
  (or a direct coder rework packet) and restart the agent for bug fixing, without
  interrupting execution (within N attempts).


  This packet is test/platform infrastructure only. It must not refactor large runtime
  modules and must not change product backend/frontend behavior.'
