title: GRACE Executor Registry MVP
objective: "Introduce a deterministic executor registry for packet execution roles.\n\
  \nThe platform currently has a hardcoded Codex launcher path. That is acceptable\n\
  for early MVPs, but the architecture needs a small stable layer that can answer:\n\
  \n```text\nrole + packet + project policy + recent attempts\n  -> selected executor\n\
  \  -> command/profile metadata\n  -> rotation/fallback decision\n  -> execution\
  \ history record\n```\n\nThis packet does not replace the managed packet runner\
  \ with multiple live\nexecutors yet. It creates the registry/policy layer, tests\
  \ it offline, and\nadds a narrow integration point so later packets can route Codex,\
  \ Claude, agy,\nor other agents without changing core lifecycle logic."
