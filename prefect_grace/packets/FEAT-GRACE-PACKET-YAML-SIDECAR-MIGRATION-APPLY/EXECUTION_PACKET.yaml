- prefect_grace/packets/FEAT-WEEK-*/**
must_preserve:
- Default mode is dry-run and produces no writes, no source mutations, no Prefect
  runs, and no live agents.
- Real apply requires `--apply`; unfiltered bulk apply is forbidden.
- Selection is required through `--stale-only` or one or more `--packet-id` values.
- Apply mode fails closed when selected plan items exceed `--limit`.
- Source-hash-changing apply requires `--i-understand-source-hash-change` and `GRACE_PACKET_YAML_MIGRATION_APPROVED=source_hash_change`.
- Apply writes only adjacent `EXECUTION_PACKET.yaml` sidecars for selected planned
  items.
- Apply must not edit markdown, runtime registry, executor history, Prefect, Docker,
  backend, or frontend.
- Invalid selected existing sidecars fail closed and are not overwritten.
- Real corpus verification must use dry-run only unless the Architect explicitly approves
  source writes.
verification: '- `python3 -m pytest -q tests/test_prefect_grace_packet_yaml_sidecar_migration_apply.py
  tests/test_prefect_grace_cli_contracts.py -q`

  - `python3 -m compileall -q prefect_grace/platform/packet_yaml_sidecar_migration_apply.py
  prefect_grace/cli_commands/evidence.py prefect_grace/cli_commands/parser.py`

