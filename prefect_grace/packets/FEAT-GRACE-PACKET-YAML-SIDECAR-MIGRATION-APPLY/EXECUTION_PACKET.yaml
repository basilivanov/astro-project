  - `python3 scripts/grace_lint.py prefect_grace/cli_commands/evidence.py`

  - `python3 scripts/grace_lint.py prefect_grace/cli_commands/parser.py`

  - `python3 -m prefect_grace.cli apply-packet-yaml-sidecar-migration --packet-root
  prefect_grace/packets --project prefect_grace/project.yaml --stale-only --dry-run
  --json --limit 10`

  - `python3 -m prefect_grace.cli apply-packet-yaml-sidecar-migration --packet-root
  prefect_grace/packets --project prefect_grace/project.yaml --apply --json`

