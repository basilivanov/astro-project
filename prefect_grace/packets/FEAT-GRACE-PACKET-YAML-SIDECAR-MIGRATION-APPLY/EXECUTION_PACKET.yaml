objective: Add a safe operator-gated apply path for canonical `EXECUTION_PACKET.yaml`
  sidecar migration that supports bounded stale-only and explicit packet-id selections
  without enabling unfiltered bulk writes.
status: ready
phase: PHASE-GRACE-ORCHESTRATOR-PORTABLE-MVP
