escalation_triggers:
- The command applies all migration plan items without an explicit selection.
- Source-hash-changing apply can write without the flag and environment approval token.
- Invalid selected sidecars are overwritten.
- Apply writes markdown, runtime registry, executor history, Prefect state, backend,
  or frontend files.
- Automated evidence performs real corpus sidecar writes without explicit approval.
