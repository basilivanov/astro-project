feature_id: FEAT-BACKEND-ACTIVE-SLICE-GRACE-CANON-SYNC
title: Backend Active Slice GRACE Canon Sync
summary: Bring the current backend active slice to a formally addressable strict-GRACE state before the deeper backend refactor and maximal observability wave.

impacted_surfaces:
  - backend
  - observability

impacted_grace_artifacts:
  - requirements.xml
  - technology.xml
  - development-plan.xml
  - knowledge-graph.xml
  - verification-matrix.md

wave_proposal:
  - W00 architect + planner canon sync
  - W01 backend canon sync implementation
  - W02 verification + review + architect gate

open_decisions:
  - Confirm exact active-slice boundaries and whether root development-plan.xml needs a delta or slice-local plan is sufficient.
  - Confirm how far correlation/logging glue can be aligned without widening into a full observability rewrite.
  - Confirm whether any currently well-marked local modules should be treated as the style reference for this backend slice.

scope:
  - Add and align module contracts, module maps, function contracts, and semantic START/END blocks for the backend active slice.
  - Prioritize main.py, logging_utils.py, day_brief.py, week_brief_service.py, scheduler.py, analytics.py, day_brief_validators.py, and correlation or logging glue around them.
  - Use already well-marked local modules as the reference style instead of rewriting clean modules again.
  - Make the backend active slice formally addressable for architect, planner, coder, verifier, and reviewer handoff before deeper refactor waves.

acceptance_criteria:
  - Key backend active-slice modules are formally addressable through GRACE contracts, maps, and stable semantic execution blocks.
  - Exported, orchestration, and side-effect entrypoints in the active slice have function contracts where required by the local GRACE style.
  - docker exec astro-project-backend-1 python3 scripts/pipeline.py remains green after the canon-sync wave.
  - Post-test evidence becomes readable by block and function names without guesswork, so the next logging wave can build on a stable canon.

non_goals:
  - Do not change scoring logic.
  - Do not change day or week business semantics.
  - Do not perform a maximal logging rewrite in this wave.
  - Do not deeply split or refactor report_workflow.py in this wave.
  - Do not go to frontend.

touches_frontend: false
requires_frontend_visual: false
visual_expectations: []

implementation:
  title: Backend Active Slice Canon Sync
  summary: Formalize backend active-slice ownership boundaries, contracts, and semantic phases before deep refactor and logging-heavy follow-up waves.

execute: true
timeout_seconds: 21600
agent_workdir: /opt/astro-project
agent_sandbox: danger-full-access

verifier:
  backend_profile: backend_quick
  frontend_profile:
  frontend_commands: []
  observability_profile: read-only
  observability_commands:
    - python3 tools/post_test_review.py --profile read-only --since 30m --report-format md
  artifact_globs:
    - logs/**
    - artifacts/**
    - prefect_grace/packets/FEAT-BACKEND-ACTIVE-SLICE-GRACE-CANON-SYNC/**
  include_day_live_canary: false
