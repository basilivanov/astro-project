feature_id: FEAT-BACKEND-GRACE-CONTRACTS-OBS-HUBS-20260417
title: Backend GRACE contracts and observability hubs
summary: >-
  Довести системные backend-хабы до strict GRACE addressability и development-grade
  observability: contracts, maps, function contracts, semantic blocks и плотные
  structured logs на значимых переходах без изменения бизнес-логики продукта.
run_planner: false
notes: >-
  Brief intentionally preserves the user's raw prioritization and leaves wave
  slicing to the architect. Architect should decide how to decompose the work
  into waves and packets.
business_context:
  scope:
    - "Первое и самое важное — довести contracts/maps до системных backend-хабов, а не только до недели. Сейчас week_brief_service.py уже оформлен как хороший эталон: у него есть START_MODULE_CONTRACT и START_MODULE_MAP с entrypoints, semantic blocks и owned tests. Но в backend/app/main.py таких маркеров по-прежнему нет, хотя это центральный backend entrypoint на 4498 строк. Значит, main.py нужно обязательно довести до того же уровня: module contract, module map, публичные/внутренние entrypoints, semantic blocks по основным фазам и явные границы владения."
    - "Второе — разметить сам logging core. backend/app/logging_utils.py уже является общей точкой для build_grace_log_payload(...) и log_grace_event(...), то есть через него проходит общая observability-модель. Но в этом файле сейчас не видно ни START_MODULE_CONTRACT, ни START_MODULE_MAP. Это надо закрыть обязательно, иначе у вас весь проект логируется через модуль, который сам формально не описан по GRACE."
    - "Третье — дотянуть day_brief.py до того же стандарта, что уже есть у week_brief_service.py. В day_brief.py есть logging-поведение, но по файлу не находятся START_MODULE_CONTRACT, START_MODULE_MAP и START_BLOCK. То есть день уже частично observable, но ещё не формально адресуемый по contracts/blocks. Нужно добавить module contract, module map, function contracts на основные entrypoints и semantic blocks на главные фазы сборки day payload."
    - "Четвёртое — закрыть мелкие, но системные сервисы, чтобы wave была единообразной. В scheduler.py и analytics.py тоже не видно START_MODULE_CONTRACT. Это не самые большие файлы, но именно такие модули часто ломают общую дисциплину: есть side effects и важные entrypoints, а формального описания нет. Их тоже нужно привести к тому же шаблону, иначе backend active slice останется синхронизированным не полностью."
    - "Пятое — после contracts/maps проставить function contracts и paired START/END blocks на ключевые функции, а не ограничиться модульной шапкой. По неделе уже видно правильный стиль: модуль описан как deterministic assembly со стабильными block names для post-test evidence review. То же нужно разнести на main.py, logging_utils.py, day_brief.py, scheduler.py, analytics.py: вход в entrypoint, major build phase, branch/fallback, closeout. Иначе логов может стать много, но они всё равно будут плохо читаемы агентами и watcher tooling."
    - "Шестое — усилить логирование не вообще везде, а на всех значимых переходах. Базовый helper уже есть, так что задача не в изобретении нового формата. Нужно пройтись по backend active slice и добавить плотные structured events на: entry/exit, branch selection, fallback, retry, external call, persistence boundary, exception conversion и final closeout. Это особенно важно для main.py, day_brief.py и системных сервисов вокруг них, потому что именно там сейчас наибольший разрыв между код работает и trace читается как цельная история."
    - "Седьмое — синхронизировать это с вашей log-watch/verdict tooling. После добавления contracts/blocks и dev-логов нужно проверить, что tool действительно может читать историю по module/fn/block/event и по correlation_id/trace_id, а не только собирать сырые записи. То есть доделка wave — это не только вставить маркеры в код, но и убедиться, что log-verdict слой получает стабильные landmarks, как уже зафиксировано в week_brief_service.py."
    - "Если совсем коротко, приоритет такой: 1) main.py, 2) logging_utils.py, 3) day_brief.py, 4) scheduler.py и analytics.py, 5) затем уже проход на function contracts + START/END blocks, 6) затем добивка плотного dev-логирования по значимым переходам и проверка через watcher/verdict tooling."
