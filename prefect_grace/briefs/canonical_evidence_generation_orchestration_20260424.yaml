feature_id: FEAT-CANONICAL-EVIDENCE-GENERATION-ORCHESTRATION-20260424
title: Canonical evidence generation orchestration for W03 closeout
summary: >-
  Repair the pipeline/orchestration path that must emit fresh Today, Week,
  Admin, and Catalog canonical evidence before wave-final observability review.
  The classification/watch tooling is now accepted, but W03 still fails because
  the required canonical evidence is missing or stale inside the 30-minute review
  window.

impacted_surfaces:
  - tools/post_test_review.py only if closeout command wiring needs a small adapter
  - tools/log_watch only if watcher CLIs need explicit evidence-generation hooks
  - scripts or backend dev/test helpers that generate Today, Week, Admin, and Catalog canonical logs
  - tests covering canonical evidence generation commands and freshness checks

impacted_grace_artifacts:
  - docs/prefect_grace/USAGE.md only if operator workflow changes
  - verification-matrix.md only if the canonical closeout command contract changes
  - knowledge-graph.xml only if ownership of evidence generation changes materially

wave_proposal:
  - W00 architect formalization must identify the exact commands that should generate fresh Today, Week, Admin, and Catalog canonical evidence.
  - The architect must distinguish runtime data generation from post-test review parsing; parsing was already repaired in FEAT-CANONICAL-OBSERVABILITY-EVIDENCE-REPAIR-20260424.
  - The implementation wave must create or repair a bounded dev/test command that emits all required canonical evidence within the review window.
  - The final verifier must run the evidence generation command first, then run `python3 tools/post_test_review.py --profile today-week --since 30m --report-format md`, read-only review, and Admin/Catalog watcher commands.
  - If live endpoints, credentials, or external services are required and unavailable, the architect must block with an explicit user-action requirement instead of fabricating evidence.

open_decisions:
  - Decide the canonical command name/location for producing fresh Today/Week/Admin/Catalog dev evidence.
  - Decide whether evidence should be generated through API-level tests, script-level producers, or existing pipeline commands.
  - Decide whether Today auth fallback and Week chunk fallback should be repaired here or explicitly emitted as expected-degradation with approved reason codes.

scope:
  - Add or repair a deterministic evidence generation command for Today and Week canonical logs.
  - Add or repair deterministic Admin and Catalog success evidence generation or freshness refresh.
  - Ensure generated records contain timestamps inside the review window and stable trace/request/correlation or provenance fields required by the accepted watcher tooling.
  - Wire verifier commands so evidence generation happens before post-test review.
  - Preserve strict reviewer behavior: do not mark rendered-only evidence as canonical and do not pass missing evidence as clean.

acceptance_criteria:
  - A single documented command or command sequence generates fresh Today, Week, Admin, and Catalog canonical evidence in the current 30-minute window.
  - "`python3 tools/post_test_review.py --profile today-week --since 30m --report-format md` no longer returns `FAIL_NO_EVIDENCE` immediately after the generation command."
  - "`python3 tools/post_test_review.py --profile read-only --since 30m --report-format md` remains clean or reports explicit expected degradation only."
  - "`python3 tools/log_watch/feed_admin_watch.py --feed-log logs/feed.jsonl --admin-log logs/admin.jsonl --window-minutes 30 --limit 200` reports fresh Admin evidence or a precise expected blocker."
  - "`python3 tools/log_watch/forecast_catalog_watch.py --catalog-log logs/catalog.jsonl --window-minutes 30 --limit 200` reports fresh Catalog evidence or a precise expected blocker."
  - Targeted tests cover the evidence generation command and freshness-window behavior.

non_goals:
  - Do not weaken post-test review or watcher verdict rules.
  - Do not fabricate canonical evidence without exercising the owned dev/test producers.
  - Do not redesign frontend UI, pricing, auth semantics, billing behavior, or report schemas.
  - Do not resume the large backend refactor until this repair has an accepted closeout.

touches_frontend: false
requires_frontend_visual: false
visual_expectations: []

implementation:
  title: Canonical Evidence Generation Orchestration
  summary: >-
    Let the architect define and implement the minimal command path that produces
    fresh canonical Today, Week, Admin, and Catalog evidence before W03 closeout.
    This is an orchestration/evidence-production repair, not another parser
    classification pass.

execute: true
run_planner: false
timeout_seconds: 14400
agent_workdir: /opt/astro-project
agent_sandbox: danger-full-access

verifier:
  backend_profile: backend_quick
  frontend_profile:
  frontend_commands: []
  observability_profile: read-only
  observability_commands:
    - python3 tools/post_test_review.py --profile read-only --since 30m --report-format md
  artifact_globs:
    - logs/*.jsonl
    - test-results/**/*.json
    - test-results/**/*.md
    - prefect_grace/packets/FEAT-CANONICAL-EVIDENCE-GENERATION-ORCHESTRATION-20260424/evidence/**
  include_day_live_canary: false
