server {
    if ($host = dev.astro.vasiliy-ivanov.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name dev.astro.vasiliy-ivanov.ru;
    return 404; # managed by Certbot


}

