services:
  db:
    ports:
      - "55433:5432"

  backend:
    user: "${ASTRO_BACKEND_UID:-1001}:${ASTRO_BACKEND_GID:-1003}"
    environment:
      ENVIRONMENT: development
      ASTRO_LOG_DIR: /app/logs
      ENABLE_ONE_OFF_ENTITLEMENTS_RUNTIME: ${ENABLE_ONE_OFF_ENTITLEMENTS_RUNTIME:-}
      ENABLE_PERSISTENT_CHECKOUT_SESSIONS: ${ENABLE_PERSISTENT_CHECKOUT_SESSIONS:-}
    volumes:
      - ./:/app
      - /opt/kilocode/.gemini:/app/.gemini
      - /opt/astro-project/.cache/codex-cliproxy-home:/app/.codex

  frontend:
    environment:
      NODE_ENV: development
    user: "0:0"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: sh -c "mkdir -p /app/.next && find /app/.next -mindepth 1 -maxdepth 1 -exec rm -rf {} + && if [ ! -d node_modules ]; then npm install; fi && npm run dev"

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      DATABASE_URL: postgresql+asyncpg://astro:astro@db:5432/astro
      WEBAPP_URL: https://astrograce.ru # Replace with ngrok or prod URL
    volumes:
      - ./bot/app:/app/app
      - ./backend/app:/app/backend/app
    ports:
      - "8001:8001"
    depends_on:
      - db
      - backend
    restart: always
