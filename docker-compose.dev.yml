services:
  db:
    ports:
      - "5432:5432"

  backend:
    environment:
      ENVIRONMENT: development
    volumes:
      - ./:/app

  frontend:
    environment:
      NODE_ENV: development
    user: "0:0"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "if [ ! -d node_modules ]; then npm install; fi && npm run dev"

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      DATABASE_URL: postgresql+asyncpg://astro:astro@db:5432/astro
      WEBAPP_URL: https://astrograce.ru # Replace with ngrok or prod URL
    volumes:
      - ./bot/app:/app/app
      - ./backend/app:/app/backend/app
    ports:
      - "8001:8001"
    depends_on:
      - db
      - backend
    restart: always