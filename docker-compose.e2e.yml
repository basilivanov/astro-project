services:
  frontend_e2e:
    image: mcr.microsoft.com/playwright:v1.46.0-jammy
    working_dir: /app
    environment:
      E2E_BASE_URL: ${E2E_BASE_URL:-http://astro-project-frontend_dev-1:3000}
      E2E_ENABLE_ONE_OFF_RUNTIME: ${E2E_ENABLE_ONE_OFF_RUNTIME:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    volumes:
      - ./frontend:/app
      - frontend_e2e_node_modules:/app/node_modules
    command: sh -c "if [ ! -x node_modules/.bin/playwright ]; then npm ci; fi && npm run test:e2e"

volumes:
  frontend_e2e_node_modules:
